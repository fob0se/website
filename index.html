<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SITHRA AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#05060a;
    --panel:#0c0e14;
    --panel2:#10131b;
    --line:rgba(255,255,255,.08);
    --text:#f1f3f8;
    --muted:#777d8c;
    --purple:#765cff;
    --blue:#00c8ff;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    overflow:hidden;
}

/* =========================
   ARKA PLAN
========================= */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(118,92,255,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(0,200,255,.13),
            transparent 30%
        ),
        #05060a;
}

.background:before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    mask-image:
        radial-gradient(
            circle,
            black,
            transparent 80%
        );
}

.orb{
    position:absolute;

    width:450px;
    height:450px;

    border-radius:50%;

    filter:blur(50px);

    background:
        radial-gradient(
            circle,
            rgba(118,92,255,.18),
            transparent 70%
        );

    animation:
        float 12s infinite alternate ease-in-out;
}

.orb.one{
    left:-180px;
    top:-150px;
}

.orb.two{
    right:-180px;
    bottom:-180px;

    background:
        radial-gradient(
            circle,
            rgba(0,200,255,.13),
            transparent 70%
        );

    animation-delay:-5s;
}

@keyframes float{
    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(80px,50px) scale(1.15);
    }
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;

    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:260px;

    flex-shrink:0;

    border-right:1px solid var(--line);

    background:
        rgba(5,6,10,.72);

    backdrop-filter:blur(25px);

    padding:25px;

    display:flex;
    flex-direction:column;
}

.logo{
    display:flex;
    align-items:center;

    gap:12px;

    font-size:20px;
    font-weight:800;

    margin-bottom:35px;
}

.logo-icon{
    width:40px;
    height:40px;

    border-radius:13px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    box-shadow:
        0 0 30px rgba(100,90,255,.35);
}

.new-chat{
    width:100%;

    padding:13px;

    border-radius:12px;

    border:1px solid var(--line);

    background:
        rgba(255,255,255,.04);

    color:white;

    cursor:pointer;

    transition:.25s;
}

.new-chat:hover{
    background:
        rgba(255,255,255,.08);

    transform:translateY(-2px);
}

.sidebar-title{
    margin-top:30px;

    color:#646a78;

    font-size:10px;

    letter-spacing:2px;

    text-transform:uppercase;
}

.system{
    margin-top:auto;

    padding:15px;

    border:1px solid var(--line);

    border-radius:14px;

    background:
        rgba(255,255,255,.025);

    color:#9298a6;

    font-size:11px;
}

.status-dot{
    display:inline-block;

    width:7px;
    height:7px;

    margin-right:8px;

    border-radius:50%;

    background:#31e87b;

    box-shadow:
        0 0 12px #31e87b;

    animation:
        statusPulse 2s infinite;
}

@keyframes statusPulse{
    50%{
        opacity:.3;
    }
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;

    min-width:0;

    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:74px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:0 35px;

    border-bottom:1px solid var(--line);

    background:
        rgba(5,6,10,.55);

    backdrop-filter:blur(20px);
}

.ai-info{
    display:flex;

    align-items:center;

    gap:12px;
}

.ai-avatar{
    width:39px;
    height:39px;

    border-radius:12px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    box-shadow:
        0 0 25px rgba(100,90,255,.3);
}

.ai-name{
    font-size:14px;
    font-weight:700;
}

.ai-status{
    margin-top:3px;

    color:#666d7b;

    font-size:10px;
}

.clear{
    width:36px;
    height:36px;

    border:0;

    border-radius:10px;

    background:
        rgba(255,255,255,.04);

    color:#9298a6;

    cursor:pointer;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;

    overflow-y:auto;

    padding:
        35px
        8%
        160px;
}

.messages::-webkit-scrollbar{
    width:5px;
}

.messages::-webkit-scrollbar-thumb{
    background:#252936;

    border-radius:10px;
}

.message{
    max-width:880px;

    margin:
        0 auto 26px;

    display:flex;

    gap:13px;

    animation:
        messageIn .3s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.avatar{
    width:36px;
    height:36px;

    flex-shrink:0;

    border-radius:11px;

    display:grid;
    place-items:center;
}

.avatar.ai{
    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    box-shadow:
        0 0 20px rgba(100,90,255,.25);
}

.avatar.user{
    background:#20232d;
}

.message-content{
    flex:1;

    min-width:0;
}

.message-name{
    margin:
        3px 0 7px;

    color:#7b8190;

    font-size:10px;

    font-weight:700;
}

.message-text{
    color:#dce0e8;

    font-size:14px;

    line-height:1.8;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}

.copy{
    margin-top:9px;

    border:0;

    background:transparent;

    color:#555c6a;

    font-size:10px;

    cursor:pointer;
}

.copy:hover{
    color:#aaa;
}

/* =========================
   TYPING
========================= */

.typing{
    display:flex;

    gap:5px;

    padding:10px 0;
}

.typing span{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#777;

    animation:
        typing 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }

    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* =========================
   INPUT
========================= */

.input-area{
    position:fixed;

    right:0;
    bottom:0;

    width:
        calc(100% - 260px);

    padding:
        22px
        8%
        25px;

    background:
        linear-gradient(
            transparent,
            var(--bg) 35%
        );

    z-index:20;
}

.input-box{
    max-width:880px;

    margin:auto;

    display:flex;

    align-items:flex-end;

    gap:9px;

    padding:10px;

    border:
        1px solid
        rgba(255,255,255,.11);

    border-radius:18px;

    background:
        rgba(14,16,24,.92);

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);

    transition:.25s;
}

.input-box:focus-within{
    border-color:
        rgba(118,92,255,.55);

    box-shadow:
        0 0 30px
        rgba(100,90,255,.08),
        0 20px 60px
        rgba(0,0,0,.5);
}

textarea{
    flex:1;

    min-height:25px;
    max-height:140px;

    resize:none;

    border:0;
    outline:0;

    padding:9px;

    background:transparent;

    color:white;

    font:
        13px
        Inter;

    line-height:1.5;
}

textarea::placeholder{
    color:#555b68;
}

.send{
    width:42px;
    height:42px;

    flex-shrink:0;

    border:0;

    border-radius:12px;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    cursor:pointer;

    font-size:16px;

    transition:.2s;

    box-shadow:
        0 0 25px
        rgba(100,90,255,.25);
}

.send:hover{
    transform:scale(1.05);

    box-shadow:
        0 0 35px
        rgba(100,90,255,.5);
}

.send:disabled{
    opacity:.45;

    cursor:not-allowed;
}

.disclaimer{
    text-align:center;

    margin-top:9px;

    color:#3d424d;

    font-size:9px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .sidebar{
        display:none;
    }

    .header{
        padding:
            0
            18px;
    }

    .messages{
        padding:
            25px
            17px
            150px;
    }

    .input-area{
        width:100%;

        padding:
            14px
            15px
            20px;
    }
}

</style>
</head>

<body>

<div class="background">

    <div class="orb one"></div>

    <div class="orb two"></div>

</div>


<div class="app">


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">

        <div class="logo-icon">
            ✦
        </div>

        SITHRA AI

    </div>


    <button
        class="new-chat"
        onclick="newChat()">

        ＋ Yeni sohbet

    </button>


    <div class="sidebar-title">
        Sistem
    </div>


    <div class="system">

        <span class="status-dot"></span>

        Sithra çevrimiçi

    </div>

</aside>


<!-- =========================
     CHAT
========================= -->

<main class="chat">


<header class="header">

    <div class="ai-info">

        <div class="ai-avatar">
            ✦
        </div>

        <div>

            <div class="ai-name">
                Sithra AI
            </div>

            <div class="ai-status">
                Yapay zekâ asistanı • Aktif
            </div>

        </div>

    </div>


    <button
        class="clear"
        onclick="newChat()">

        ↻

    </button>

</header>


<div
    class="messages"
    id="messages">

</div>


</main>

</div>


<!-- =========================
     INPUT
========================= -->

<div class="input-area">

    <div class="input-box">

        <textarea
            id="input"
            rows="1"
            placeholder="Sithra'ya bir şey sor..."
        ></textarea>


        <button
            class="send"
            id="send"
            onclick="sendMessage()">

            ➤

        </button>

    </div>


    <div class="disclaimer">

        Sithra AI bazen hata yapabilir.
        Önemli bilgileri doğrulayın.

    </div>

</div>


<script>

/* ==================================================
   API AYARI
================================================== */

/*
   BURAYA YENİ API KEY'İNİ YAZ.

   ÖRNEK:

   const API_KEY = "sk-proj-xxxxxxxx";

   DİKKAT:
   BU YÖNTEM API KEY'İ TARAYICIDA GÖRÜNÜR YAPAR.
*/

const API_KEY =
"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";


/* ==================================================
   ELEMENTLER
================================================== */

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const messages =
document.getElementById("messages");


/* ==================================================
   HTML GÜVENLİĞİ
================================================== */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==================================================
   MESAJ EKLE
================================================== */

function addMessage(text,type){

    const message =
        document.createElement("div");

    message.className =
        "message";


    const isAI =
        type === "ai";


    message.innerHTML = `

        <div class="avatar ${isAI ? "ai" : "user"}">

            ${isAI ? "✦" : "●"}

        </div>


        <div class="message-content">

            <div class="message-name">

                ${isAI ? "SITHRA" : "SEN"}

            </div>


            <div class="message-text">

                ${escapeHTML(text)}

            </div>


            ${
                isAI

                ?

                `
                <button
                    class="copy"
                    onclick="copyMessage(this)">

                    Kopyala

                </button>
                `

                :

                ""

            }

        </div>

    `;


    messages.appendChild(message);


    messages.scrollTop =
        messages.scrollHeight;

}


/* ==================================================
   TYPING
================================================== */

function showTyping(){

    const message =
        document.createElement("div");

    message.id =
        "typingMessage";

    message.className =
        "message";


    message.innerHTML = `

        <div class="avatar ai">
            ✦
        </div>


        <div class="message-content">

            <div class="message-name">
                SITHRA
            </div>


            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    messages.appendChild(message);


    messages.scrollTop =
        messages.scrollHeight;

}


/* ==================================================
   OPENAI
================================================== */

async function askSithra(userMessage){

    if(
        !API_KEY ||
        API_KEY ===
        "BURAYA_YENI_API_KEYINI_YAZ"
    ){

        throw new Error(
            "API anahtarını kodun içindeki API_KEY alanına ekle."
        );

    }


    const response =
        await fetch(
            "https://api.openai.com/v1/responses",
            {

                method:"POST",


                headers:{

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + API_KEY

                },


                body:JSON.stringify({

                    model:
                        "gpt-5.6-luna",


                    instructions:`

Sen SITHRA AI'sın.

Kullanıcıyla Türkçe konuş.

Kendini ChatGPT veya OpenAI
olarak tanıtma.

Kendini SITHRA AI olarak tanıt.

Tarzın:

- modern
- zeki
- sakin
- özgüvenli
- hafif gizemli
- yardımsever

Kodlama sorularında çalışır
kod örnekleri ver.

HTML, CSS, JavaScript,
Python, C++, C#, Java,
PHP, SQL ve TypeScript
konularında yardımcı ol.

GTA World hakkında soru
sorulursa yardımcı ol.

Bilmediğin bilgileri
uydurma.

Cevapları gereksiz yere
uzatma ama gerektiğinde
detaylandır.

`,


                    input:
                        userMessage

                })

            });


    if(!response.ok){

        let errorText =
            await response.text();

        try{

            const errorJSON =
                JSON.parse(errorText);

            errorText =
                errorJSON?.error?.message ||
                errorText;

        }

        catch{

        }


        throw new Error(
            "OpenAI API Hatası: " +
            errorText
        );

    }


    const data =
        await response.json();


    if(!data.output_text){

        throw new Error(
            "Sithra cevap üretemedi."
        );

    }


    return data.output_text;

}


/* ==================================================
   MESAJ GÖNDER
================================================== */

async function sendMessage(){

    const text =
        input.value.trim();


    if(!text)
        return;


    if(send.disabled)
        return;


    addMessage(
        text,
        "user"
    );


    input.value = "";

    input.style.height =
        "auto";


    send.disabled =
        true;


    showTyping();


    try{

        const answer =
            await askSithra(text);


        const typing =
            document.getElementById(
                "typingMessage"
            );


        if(typing)
            typing.remove();


        addMessage(
            answer,
            "ai"
        );

    }


    catch(error){

        const typing =
            document.getElementById(
                "typingMessage"
            );


        if(typing)
            typing.remove();


        addMessage(

            "Sithra bağlantısında hata oluştu.\n\n" +
            error.message,

            "ai"

        );


        console.error(error);

    }


    finally{

        send.disabled =
            false;

        input.focus();

    }

}


/* ==================================================
   KOPYALA
================================================== */

async function copyMessage(button){

    const text =
        button
        .parentElement
        .querySelector(
            ".message-text"
        )
        .innerText;


    try{

        await navigator.clipboard
            .writeText(text);


        button.innerText =
            "Kopyalandı ✓";


        setTimeout(()=>{

            button.innerText =
                "Kopyala";

        },1500);

    }

    catch{

        button.innerText =
            "Kopyalanamadı";

    }

}


/* ==================================================
   YENİ SOHBET
================================================== */

function newChat(){

    messages.innerHTML = "";


    addMessage(

        `Merhaba. Ben Sithra AI.

Kodlama, teknoloji, GTA World,
fikir üretme, yazı yazma ve
genel konularda sana yardımcı
olabilirim.

Ne yapmak istiyorsun?`,

        "ai"

    );

}


/* ==================================================
   ENTER
================================================== */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==================================================
   TEXTAREA BOYUTU
================================================== */

input.addEventListener(
    "input",
    function(){

        this.style.height =
            "auto";


        this.style.height =
            Math.min(
                this.scrollHeight,
                140
            ) + "px";

    }
);


/* ==================================================
   BAŞLANGIÇ
================================================== */

newChat();

</script>

</body>
</html>
